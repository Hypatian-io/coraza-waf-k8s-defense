    <body>
      <header>
        <div class="brand">
          <div class="shield">🛡️</div>
          <div>
            <h1>Coraza WAF v3 &amp; OWASP CRS Console — example.com</h1>
            <p>Native Go Coraza SecLang Engine &bull; Fronting Public Traffic (`web-frontend` &amp; `api-backend`) &bull; Shipping to OpenSearch `logs-waf-*`</p>
          </div>
        </div>
        <div class="ext-links">
          <a class="btn btn-outline" href="http://10.0.20.50:5601/app/dashboards#/view/dashboard-waf-logs" target="_blank">📊 OpenSearch WAF Dashboard</a>
          <a class="btn btn-outline" href="http://10.0.20.50:5601/app/alerting#/monitors" target="_blank">🔔 OpenSearch Alerting Monitors</a>
          <button class="btn btn-success" onclick="saveAndReload()">⚡ Validate &amp; Hot-Reload WAF Rules</button>
        </div>
      </header>

      <div class="container">
        <div id="statusBanner" class="banner"></div>

