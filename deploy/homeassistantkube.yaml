apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: homeassistant-config-pvc
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: homeassistant-media-pvc
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: homeassistant
  labels:
    app: homeassistant
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: homeassistant
  template:
    metadata:
      labels:
        app: homeassistant
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: homeassistant
          image: ghcr.io/home-assistant/home-assistant:stable
          imagePullPolicy: Always
          securityContext:
            privileged: true
          volumeMounts:
            - name: config-volume
              mountPath: /config
            - name: media-volume
              mountPath: /media
            - name: localtime
              mountPath: /etc/localtime
              readOnly: true
            - name: dbus
              mountPath: /run/dbus
              readOnly: true
        - name: fluent-bit-sidecar
          image: fluent/fluent-bit:latest
          imagePullPolicy: IfNotPresent
          command: ["/fluent-bit/bin/fluent-bit", "-c", "/fluent-bit/etc/fluent-bit-app.conf"]
          env:
            - name: APP_NAME
              value: "homeassistant"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          resources:
            requests:
              cpu: 10m
              memory: 24Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: config-volume
              mountPath: /config
              readOnly: true
            - name: sidecar-config
              mountPath: /fluent-bit/etc
      volumes:
        - name: config-volume
          persistentVolumeClaim:
            claimName: homeassistant-config-pvc
        - name: media-volume
          persistentVolumeClaim:
            claimName: homeassistant-media-pvc
        - name: localtime
          hostPath:
            path: /etc/localtime
            type: File
        - name: dbus
          hostPath:
            path: /run/dbus
            type: Directory
        - name: sidecar-config
          configMap:
            name: fluent-bit-sidecar-config
            defaultMode: 0755
